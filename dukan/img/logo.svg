<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="دكان">
  <title>دكان</title>
  <defs>
    <linearGradient id="dg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12796A"/>
      <stop offset=".55" stop-color="#0E6B5C"/>
      <stop offset="1" stop-color="#062F28"/>
    </linearGradient>
    <linearGradient id="dg-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D68C"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
    <linearGradient id="dg-gold-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7D68C"/>
      <stop offset=".5" stop-color="#E7B552"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
    <linearGradient id="dg-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#F0E7D5"/>
    </linearGradient>
    <linearGradient id="dg-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C5A4D"/>
      <stop offset="1" stop-color="#073E35"/>
    </linearGradient>
    <linearGradient id="dg-gloss" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".20"/>
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dg-canopy">
      <path d="M22 43 H106 L112 66 H16 Z"/>
    </clipPath>
  </defs>

  <!-- خلفية شعار دكان -->
  <rect width="128" height="128" rx="30" fill="url(#dg-bg)"/>
  <circle cx="98" cy="26" r="48" fill="#FFFFFF" opacity=".07"/>
  <circle cx="16" cy="114" r="42" fill="#000000" opacity=".10"/>

  <!-- مبنى الدكان -->
  <path d="M28 58 H100 V98 a6 6 0 0 1 -6 6 H34 a6 6 0 0 1 -6 -6 Z" fill="url(#dg-cream)"/>

  <!-- الباب -->
  <rect x="55" y="76" width="18" height="28" rx="4" fill="url(#dg-door)"/>
  <circle cx="69" cy="91" r="2.2" fill="url(#dg-gold)"/>

  <!-- النوافذ الذهبية -->
  <rect x="34" y="76" width="17" height="17" rx="3.5" fill="#DCEFE9" stroke="url(#dg-gold)" stroke-width="2.5"/>
  <rect x="77" y="76" width="17" height="17" rx="3.5" fill="#DCEFE9" stroke="url(#dg-gold)" stroke-width="2.5"/>

  <!-- القاعدة الذهبية -->
  <rect x="24" y="98" width="80" height="8" rx="4" fill="url(#dg-gold)"/>

  <!-- مظلة المحل المخططة -->
  <g clip-path="url(#dg-canopy)">
    <rect x="16" y="40" width="16" height="30" fill="url(#dg-cream)"/>
    <rect x="32" y="40" width="16" height="30" fill="#0E6B5C"/>
    <rect x="48" y="40" width="16" height="30" fill="url(#dg-cream)"/>
    <rect x="64" y="40" width="16" height="30" fill="#0E6B5C"/>
    <rect x="80" y="40" width="16" height="30" fill="url(#dg-cream)"/>
    <rect x="96" y="40" width="16" height="30" fill="#0E6B5C"/>
  </g>
  <!-- حواف المظلة الدائرية -->
  <circle cx="24" cy="66" r="8" fill="url(#dg-cream)"/>
  <circle cx="40" cy="66" r="8" fill="#0E6B5C"/>
  <circle cx="56" cy="66" r="8" fill="url(#dg-cream)"/>
  <circle cx="72" cy="66" r="8" fill="#0E6B5C"/>
  <circle cx="88" cy="66" r="8" fill="url(#dg-cream)"/>
  <circle cx="104" cy="66" r="8" fill="#0E6B5C"/>

  <!-- لافتة المحل الذهبية -->
  <rect x="24" y="34" width="80" height="9" rx="4.5" fill="url(#dg-gold-h)"/>
  <rect x="27" y="36.4" width="74" height="2.6" rx="1.3" fill="#FFFFFF" opacity=".38"/>

  <!-- لمعان علوي -->
  <rect width="128" height="128" rx="30" fill="url(#dg-gloss)"/>

  <!-- نجوم سحرية -->
  <path d="M104 15 C104.8 20 108 23.2 113 24 C108 24.8 104.8 28 104 33 C103.2 28 100 24.8 95 24 C100 23.2 103.2 20 104 15 Z" fill="url(#dg-gold)"/>
  <path d="M116 43 C116.4 45.5 118 47.1 120.5 47.5 C118 47.9 116.4 49.5 116 52 C115.6 49.5 114 47.9 111.5 47.5 C114 47.1 115.6 45.5 116 43 Z" fill="url(#dg-gold)" opacity=".85"/>
  <path d="M13 28 C13.5 31 15.5 33 18.5 33.5 C15.5 34 13.5 36 13 39 C12.5 36 10.5 34 7.5 33.5 C10.5 33 12.5 31 13 28 Z" fill="url(#dg-gold)" opacity=".9"/>
</svg>
