<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول البائعين — دكان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="flex items-center gap-3 mb-8">
      <span class="brand-mark">د</span>
      <span class="font-display text-lg">دكان</span>
    </a>
    <h1 class="font-display text-xl mb-1">تسجيل دخول البائعين</h1>
    <p class="text-sm text-gray-500 mb-6">أدر متجرك وتابع طلباتك من لوحة التحكم.</p>

    <div id="errorBox" class="auth-error hidden mb-4"></div>

    <form id="loginForm" class="space-y-4">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" name="password" required>
      </div>
      <label class="flex items-center gap-2 text-sm" style="cursor:pointer">
        <input type="checkbox" name="remember" id="rememberMe" checked style="width:16px;height:16px">
        تذكّرني
      </label>
      <button type="submit" class="btn-primary w-full">دخول</button>
    </form>

    <p class="text-sm text-gray-500 mt-6 text-center">
      ليس لديك حساب؟ <a href="register.html" class="font-semibold" style="color: var(--c-primary)">سجّل متجرك الآن</a>
    </p>
  </div>
</div>

<script type="module">
  import { Auth } from "./js/auth.js";

  Auth.redirectIfLoggedIn();

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("errorBox");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.add("hidden");
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "جارٍ الدخول…";
    const fd = new FormData(form);
    try {
      await Auth.login({
        email: fd.get("email"),
        password: fd.get("password"),
        remember: document.getElementById("rememberMe").checked,
      });
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove("hidden");
      submitBtn.disabled = false;
      submitBtn.textContent = "دخول";
    }
  });
</script>
</body>
</html>
