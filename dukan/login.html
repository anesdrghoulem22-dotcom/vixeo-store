<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول البائعين — دكان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="flex items-center gap-3 mb-8">
      <img class="brand-mark" src="img/logo.svg" alt="دكان" width="44" height="44">
      <span class="font-display text-lg">دكان</span>
    </a>
    <span data-lang-switch class="auth-switch-pos"></span>
    <h1 class="font-display text-xl mb-1" data-i18n="تسجيل دخول البائعين">تسجيل دخول البائعين</h1>
    <p class="text-sm text-gray-500 mb-6" data-i18n="أدر متجرك وتابع طلباتك من لوحة التحكم.">أدر متجرك وتابع طلباتك من لوحة التحكم.</p>

    <div id="errorBox" class="auth-error hidden mb-4"></div>

    <form id="loginForm" class="space-y-4">
      <div class="field">
        <label data-i18n="البريد الإلكتروني">البريد الإلكتروني</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label data-i18n="كلمة المرور">كلمة المرور</label>
        <input type="password" name="password" required>
      </div>
      <label class="flex items-center gap-2 text-sm" style="cursor:pointer">
        <input type="checkbox" name="remember" id="rememberMe" checked style="width:16px;height:16px">
        <span data-i18n="تذكّرني">تذكّرني</span>
      </label>
      <button type="submit" class="btn-primary w-full" data-i18n="دخول">دخول</button>
    </form>

    <p class="text-sm text-gray-500 mt-6 text-center">
      <span data-i18n="ليس لديك حساب؟">ليس لديك حساب؟</span> <a href="register.html" class="font-semibold" style="color: var(--c-primary)" data-i18n="سجّل متجرك الآن">سجّل متجرك الآن</a>
    </p>
  </div>
</div>

<script type="module" src="js/i18n.js"></script>
<script type="module">
  import { Auth } from "./js/auth.js";
  import { I18n } from "./js/i18n.js";

  Auth.redirectIfLoggedIn();

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("errorBox");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.add("hidden");
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = I18n.t("جارٍ الدخول…");
    const fd = new FormData(form);
    try {
      await Auth.login({
        email: fd.get("email"),
        password: fd.get("password"),
        remember: document.getElementById("rememberMe").checked,
      });
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove("hidden");
      submitBtn.disabled = false;
      submitBtn.textContent = I18n.t("دخول");
    }
  });
</script>
</body>
</html>
