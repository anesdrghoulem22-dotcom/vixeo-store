<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر البائع — دكان</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
    <a href="index.html" class="flex items-center gap-3">
      <img class="brand-mark" src="img/logo.svg" alt="دكان" width="44" height="44">
      <span class="font-display text-lg">دكان</span>
    </a>
    <nav class="hidden md:flex items-center gap-6 text-sm">
      <a href="market.html" class="nav-link" data-i18n="كل المنتجات">كل المنتجات</a>
    </nav>
    <div class="flex items-center gap-3">
      <span data-lang-switch></span>
      <a href="cart.html" class="cart-fab">
        🛒 <span data-i18n="السلة">السلة</span>
        <span class="cart-badge hidden" data-cart-badge>0</span>
      </a>
    </div>
  </div>
</header>

<div id="storeWrap">
  <div class="storefront-banner" id="storeBanner"></div>

  <div class="storefront-head">
    <div class="storefront-logo" id="sellerAvatar">د</div>
    <div class="storefront-head-main">
      <div class="storefront-head-row">
        <div class="storefront-title-wrap">
          <p class="storefront-kicker" data-i18n="✦ متجر على منصة دكان">✦ متجر على منصة دكان</p>
          <h1 class="font-display text-2xl md:text-3xl" id="sellerStoreName">—</h1>
        </div>
        <button id="copyStoreLinkBtn" class="btn-outline storefront-copy-btn !py-2 !px-4 text-sm" data-i18n="🔗 نسخ رابط المتجر">🔗 نسخ رابط المتجر</button>
      </div>
      <p id="sellerBio" class="storefront-bio hidden text-sm" style="max-width:60ch;line-height:1.9;margin-top:.6rem"></p>
      <div id="sellerSocials" class="storefront-socials flex gap-2" style="margin-top:.8rem"></div>
    </div>
  </div>

  <div class="trust-strip" data-reveal>
    <div class="trust-item"><span class="trust-icon">🚚</span> <span data-i18n="توصيل لكل الولايات">توصيل لكل الولايات</span></div>
    <div class="trust-item"><span class="trust-icon">💵</span> <span data-i18n="الدفع عند الاستلام">الدفع عند الاستلام</span></div>
    <div class="trust-item"><span class="trust-icon">💬</span> <span data-i18n="تواصل مباشر عبر واتساب">تواصل مباشر عبر واتساب</span></div>
    <div class="trust-item"><span class="trust-icon">✓</span> <span data-i18n="منتجات موثوقة">منتجات موثوقة</span></div>
  </div>

  <main class="max-w-6xl mx-auto px-5 py-10">
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 mb-6" data-reveal>
      <div class="hero-search flex items-center gap-3 px-4 py-2.5 flex-1">
        <span>🔍</span>
        <input id="storeSearchInput" type="text" data-i18n-ph="ابحث في منتجات هذا المتجر…" placeholder="ابحث في منتجات هذا المتجر…">
      </div>
    </div>
    <div id="storeCategoryBar" class="flex items-center gap-2 overflow-x-auto pb-2 mb-6"></div>

    <div id="sellerProductGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5"></div>
    <p id="sellerEmptyState" class="hidden text-center py-20 text-gray-500" data-i18n="لم يضف هذا البائع أي منتج بعد.">لم يضف هذا البائع أي منتج بعد.</p>
  </main>
</div>

<footer class="site-footer">
  <div class="max-w-6xl mx-auto px-5 py-8 footer-note text-sm flex flex-col md:flex-row items-center justify-between gap-3">
    <a href="index.html" class="flex items-center gap-3">
      <img class="brand-mark" src="img/logo.svg" alt="دكان" width="40" height="40">
      <span class="font-display text-base" style="color:#fff">دكان</span>
    </a>
    <p data-i18n="متجر يعمل على منصة دكان — طلبات مباشرة عبر واتساب.">متجر يعمل على منصة دكان — طلبات مباشرة عبر واتساب.</p>
  </div>
</footer>

<script src="js/reveal.js" defer></script>
<script type="module" src="js/i18n.js"></script>
<script type="module">
  import { Store } from "./js/store.js";
  Store.initSellerStore();
</script>
</body>
</html>
